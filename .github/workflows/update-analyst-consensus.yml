name: Update analyst consensus

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and validate consensus
        run: node scripts/update-analyst-consensus.mjs

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- src/lib/analystConsensusSnapshot.json; then
            echo "No consensus changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/analystConsensusSnapshot.json
          git commit -m "data: update analyst consensus"
          git push
